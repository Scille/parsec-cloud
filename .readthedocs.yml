# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# The Docker image used for building the docs.
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  # Override jobs since read the docs native support for uv seems broken with uv 0.12
  # See: https://github.com/readthedocs/readthedocs.org/issues/13213
  jobs:
    create_environment:
      - uv venv --project "${READTHEDOCS_REPOSITORY_PATH}/${UV_PROJECT}" "${READTHEDOCS_VIRTUALENV_PATH}"
    build:
      html:
        - uv run --project "${READTHEDOCS_REPOSITORY_PATH}/${UV_PROJECT}" --no-sync --no-dev sphinx-build -T -b html -d $READTHEDOCS_REPOSITORY_PATH/docs/_build/doctrees -D language=$READTHEDOCS_LANGUAGE $READTHEDOCS_REPOSITORY_PATH/docs $READTHEDOCS_OUTPUT/html

python:
  install:
    - path: docs
      method: uv
      command: sync

# Note: Read the docs does not support multiple pdfs generation
# See https://github.com/readthedocs/readthedocs.org/issues/2045
# Build our docs in additional formats such as PDF
# formats:
#   - pdf

sphinx:
  configuration: docs/conf.py

# Note we don't need to install the project to generate documentation, this should
# save us from random breakage when updating minimal Python and dependencies ;-)
