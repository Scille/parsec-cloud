<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OnlyOffice</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #placeholder {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="placeholder"></div>
    <script>
      // POC host page for the vendored OnlyOffice client (see client/vendors/onlyoffice/README.md).
      //
      // This page is loaded in an iframe by FileEditor.vue / src/services/onlyoffice.ts. It loads the
      // vendored `DocsAPI` script and bridges it to the parent window with postMessage, replacing the
      // websocket-based server communication OnlyOffice normally relies on with the `connectMockServer`
      // hook that CryptPad's OnlyOffice fork exposes for that purpose.
      //
      // Step 3.2 (see root CLAUDE.md): the actual client/server protocol is now mocked by
      // onlyoffice-mock-server.js (localStorage + BroadcastChannel only, no network - see that file
      // and notes/communication_protocol.md), instead of a bare no-op stub. It shows every message the
      // client sends/receives in an on-page debug panel, and two tabs opening the same document join
      // the same simulated session. Document *content* is still never sent back to Parsec: there's no
      // save/export wired up yet.
      (function () {
        var parentWindow = window.parent;

        function postToParent(command, data) {
          parentWindow.postMessage(Object.assign({ command: command }, data || {}), '*');
        }

        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            var script = document.createElement('script');
            script.src = src;
            script.onload = function () {
              resolve();
            };
            script.onerror = function () {
              reject(new Error('Failed to load ' + src));
            };
            document.head.appendChild(script);
          });
        }

        function buildConfig(options) {
          var blob = new Blob([options.documentContent], { type: 'application/octet-stream' });
          var url = URL.createObjectURL(blob);

          return {
            width: '100%',
            height: '100%',
            documentType: options.documentType,
            document: {
              key: options.key,
              title: options.documentName,
              url: url,
              permissions: {
                edit: options.mode === 'edit',
                download: false,
                print: true,
              },
            },
            editorConfig: {
              mode: options.mode,
              lang: options.locale,
              user: {
                id: options.userId,
                name: options.userName,
              },
              customization: {
                compactHeader: false,
                chat: false,
                comments: false,
                help: false,
                about: false,
                feedback: false,
                anonymous: { request: false },
                uiTheme: options.theme === 'dark' ? 'theme-dark' : 'theme-classic-light',
              },
            },
            events: {
              onAppReady: function () {
                postToParent('oo-app-ready');
              },
              onDocumentReady: function () {
                postToParent('oo-ready');
              },
              onError: function (event) {
                postToParent('oo-error', { details: event && event.data !== undefined ? JSON.stringify(event.data) : String(event) });
              },
            },
          };
        }

        function openDocument(options) {
          Promise.all([loadScript('/onlyoffice/web-apps/apps/api/documents/api.js'), loadScript('/onlyoffice-mock-server.js')])
            .then(function () {
              if (!window.DocsAPI || !window.DocsAPI.DocEditor) {
                postToParent('oo-error', { details: 'DocsAPI is not available' });
                return;
              }
              // CryptPad's OnlyOffice fork's `connectMockServer` reaches for `window.APP.getImageURL`
              // without initializing `window.APP` itself: CryptPad's own host page normally does
              // that as part of its own (much larger) bootstrap. Do the same here.
              window.APP = window.APP || {};
              var config = buildConfig(options);
              var docEditor = new window.DocsAPI.DocEditor('placeholder', config);
              var mockServer = window.OnlyOfficeMockServer.create({
                documentId: options.documentId,
                userId: options.userId,
                userName: options.userName,
                mode: options.mode,
              });
              mockServer.setEditor(docEditor);
              window.addEventListener('pagehide', function () {
                mockServer.destroy();
              });
              docEditor.connectMockServer(mockServer);
            })
            .catch(function (err) {
              postToParent('oo-error', { details: err.message });
            });
        }

        window.addEventListener('message', function (event) {
          if (event.source !== parentWindow) {
            return;
          }
          var data = event.data;
          if (!data || data.command !== 'oo-open') {
            return;
          }
          openDocument(data.options);
        });

        postToParent('oo-host-ready');
      })();
    </script>
  </body>
</html>
