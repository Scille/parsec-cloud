events {
    worker_connections 128;
}
error_log /dev/stderr info;


http {
    # Catch-all server: reject the requests whose `Host` header doesn't match
    # any of the `server_name`s declared in the other server blocks.
    # This is required for security: the Parsec Server relies on the `Host`
    # header to distinguish the main domain from the editics ones, so a request
    # with a forged `Host` header must not be forwarded to it.
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        # Hide version number
        server_tokens off;
        access_log /dev/stdout;

        # Refuse the TLS handshake if the client's SNI doesn't match any server
        ssl_reject_handshake on;

        return 400;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name app.parsec.localhost;
        http2 on;
        # Hide version number
        server_tokens off;
        access_log /dev/stdout;

        # Only provide tlsv1.3
        ssl_protocols       TLSv1.3;
        ssl_certificate     /run/secrets/proxy-pem-crt;
        ssl_certificate_key /run/secrets/proxy-pem-key;

        location ~ ^/authenticated/.*/events$ {
            proxy_pass https://parsec-server:6777;

            # Specific configuration for SSE:
            # Disable buffering, cache & chunking
            proxy_buffering             off;
            proxy_cache                 off;
            chunked_transfer_encoding   off;
            proxy_read_timeout          24h;

            # Add X-Forwarded headers to the proxied request
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # Clear headers that may have been set by a malicious request
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";

            # Forward the original Host header: the Parsec Server relies on it
            # to distinguish the main domain from the editics ones. Requests
            # with an unknown Host are rejected by the catch-all server above.
            proxy_set_header Host $http_host;
        }

        location / {
            proxy_pass https://parsec-server:6777;

            # Add X-Forwarded headers to the proxied request
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # Clear headers that may have been set by a malicious request
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";

            # Forward the original Host header: the Parsec Server relies on it
            # to distinguish the main domain from the editics ones. Requests
            # with an unknown Host are rejected by the catch-all server above.
            proxy_set_header Host $http_host;
        }
    }
}
