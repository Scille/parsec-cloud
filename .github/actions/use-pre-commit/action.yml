name: pre-commit
description: install & run-precommit

inputs:
  extra-args:
    description: options to pass to pre-commit run-precommit
    required: false
    default: ""
  config-file:
    description: where is located the pre-commit config file
    required: false
    default: .pre-commit-config.yaml
  install-only:
    description: Only install pre-commit without running it.
    required: false
    default: "false"
  save-cache:
    description: Should we save data in cache
    required: false
    default: ${{ github.event_name != 'merge_group' }}

outputs:
  cache-hit:
    description: A boolean value to indicate an exact match was found for the key.
    value: ${{ steps.cache-pre-commit.outputs.cache-hit }}
  suggested-args:
    description: Suggested args to run pre-commit on the minimum of files.
    value: ${{ steps.suggested-run.outputs.args }}

runs:
  using: composite
  steps:
    - name: Install prek
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: prek

    - name: Get prek cache info
      id: cache
      shell: bash -eux -o pipefail {0}
      run: |
        (echo -n path=; prek cache dir ) | tee -a $GITHUB_OUTPUT
        echo "key=prek-0-${{ hashFiles(inputs.config-file) }}" | tee -a $GITHUB_OUTPUT

    - name: Restore prek cache
      id: cache-prek
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.cache.outputs.key }}
        path: ${{ steps.cache.outputs.path }}

    - name: Prepare env
      shell: bash
      run: |
        prek prepare-hooks
        prek cache gc

    - name: Save prek cache
      if: inputs.save-cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.cache.outputs.key }}
        path: ${{ steps.cache.outputs.path }}

    - name: Minimal pre-commit work
      id: suggested-run
      shell: bash
      run: |
        echo 'Suggested prek args:'
        (
          case "${{ github.event_name }}" in
            pull_request)
              # Ensure base ref is in the git tree
              git fetch origin ${{ github.base_ref }} >&2
              echo "args=--to-ref=HEAD --from-ref=origin/${{ github.base_ref }}"
            ;;
            *)
              echo "args=--all-files"
            ;;
          esac
        ) | tee -a $GITHUB_OUTPUT

    - name: Run prek
      if: inputs.install-only != 'true'
      shell: bash -ex {0}
      run: |
        prek \
          run \
          --verbose \
          --show-diff-on-failure \
          --color=always \
          $EXTRA_ARGS
      env:
        EXTRA_ARGS: >-
          ${{ inputs.config-file != '' && format('--config={0}', inputs.config-file) || '' }}
          ${{ steps.suggested-run.outputs.args }}
          ${{ inputs.extra-args }}
