name: Commit Lint

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      # Also trigger on label added/removed to check for `ignore-changelog`
      - labeled
      - unlabeled
      # Or when the title/body as changed
      - edited
  merge_group:
  push:
    branches:
      - master
      - releases/*

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-commit:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install commitlint
        run: npm install -D @commitlint/cli @commitlint/config-conventional

      - name: Print versions
        run: |
          git --version
          node --version
          npm --version
          npx commitlint --version

      # https://docs.github.com/en/webhooks/webhook-events-and-payloads#push
      - name: Validate pushed commits
        if: github.event_name == 'push'
        run: >
          npx commitlint --verbose
          --from ${{ github.event.before }}
          --to ${{ github.event.after }}

      # Directly use pull request event values
      # https://docs.github.com/en/webhooks/webhook-events-and-payloads?actionType=opened#pull_request
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: >-
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      # https://docs.github.com/en/webhooks/webhook-events-and-payloads?actionType=opened#pull_request
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        run: |
          cat << EOF | npx commitlint --verbose
          ${{ github.event.pull_request.title }}

          ${{ github.event.pull_request.body }}
          EOF

      # https://docs.github.com/en/webhooks/webhook-events-and-payloads#merge_group
      - name: Validate MQ commits
        if: github.event_name == 'merge_group'
        run: >-
          npx commitlint --verbose
          --from ${{ github.event.merge_group.base_sha }}
          --to ${{ github.event.merge_group.head_sha }}
