name: package-cli

on:
  workflow_call:
    inputs:
      version:
        description: The version to use
        type: string
        required: true
      version_patch_run_id:
        description: |
          The run id where the version.patch artifact was uploaded.
          If not provided, the workflow will generate the patch by itself.
        type: string
        required: true
      commit_sha:
        required: true
        type: string
        description: The commit SHA to use when checkout'ing the repository
        default: ${{ github.sha }}
    secrets:
      # Azure Trusted Signing credentials, used to sign the Windows artifacts.
      # Note the workflow is also triggered directly by pull_request/workflow_dispatch
      # (i.e. not through workflow_call)
      AZURE_TENANT_ID:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: true
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: true
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME:
        required: true
      AZURE_TRUSTED_SIGNING_PROFILE_NAME:
        required: true

  # PS: If you trigger manually the packaging, take into account that it will use the workflow as defined in the main branch not in the target branch.
  workflow_dispatch:
    inputs:
      version:
        description: The version to use (if not provided will generated one from the code space version)
        type: string
        required: false
  pull_request:
    paths:
      - .github/workflows/package-cli.yml

# We set `concurrency` to prevent having this workflow being run on code that is not up-to-date on a PR (a user make multiple push in a quick manner).
# But on the main branch, we don't want that behavior.
# Having the workflow run on each merge commit is something we would like, that could help us where a regression was made and missed by previous checks.
#
# For that we use `head_ref` that is only defined on `pull-request` and fallback to `run_id` (this is a counter, so it's value is unique between workflow call).
concurrency:
  group: package-cli-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    if: ${{ inputs.version_patch_run_id == '' }}
    uses: ./.github/workflows/_parse_version.yml
    with:
      version: ${{ inputs.version }}
      commit_sha: ${{ inputs.commit_sha }}

  package-cli:
    needs: version
    # Always run the job if `version` job is skipped otherwise only if `version` job was successful.
    if: ${{ inputs.version_patch_run_id != '' && always() || success() }}
    name: 📦 Packaging CLI for ${{ matrix.arch }}-${{ matrix.vendor }}-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    env:
      cross-version: 0.2.5
      WINFSP_VERSION: 2.1.25156
    strategy:
      fail-fast: false
      # Parsec CLI has three potential dynamic dependencies: `libc`, `fuse3` and `openssl`, hence we have two build strategy here:
      matrix:
        arch: [x86_64]
        vendor: [unknown]
        runner: [ubuntu-24.04]
        os:
          # The MUSL target provide a statically linked CLI
          - linux-musl
          # The GNU target provide a dynamically linked CLI
          - linux-gnu
        include:
          - os: windows-msvc
            vendor: pc
            arch: x86_64
            runner: windows-2025
            extension: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
        timeout-minutes: 5

      - name: Retrieve runner specs
        id: runner-specs
        uses: ./.github/actions/system-info
        timeout-minutes: 1

      - name: Download version.patch artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin v8.0.1
        with:
          name: version.patch
          digest-mismatch: error
          path: ${{ runner.temp }}/version.patch
          run-id: ${{ inputs.version_patch_run_id || github.run_id }}
        timeout-minutes: 2

      - name: Load version config
        id: version
        shell: bash
        run: tee "$GITHUB_OUTPUT" < "${{ runner.temp }}/version.patch/version.ini"
        timeout-minutes: 1

      - name: Apply version.patch
        run: git apply --allow-empty ${{ runner.temp }}/version.patch/version.patch
        timeout-minutes: 1

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # pin v2.87.22
        with:
          tool: cross@${{ env.cross-version }}
        timeout-minutes: 5

      - name: Install yq
        # TODO: Merge me in the above taiki-e/install-action action once https://github.com/taiki-e/install-action/pull/2036 is merged
        uses: FirelightFlagboy/install-action@tool-yq-go
        with:
          tool: yq-go
        timeout-minutes: 1

      # Building OpenSSL requires a perl interpreter.
      # The default one does not provide windows-style filesystem
      # paths so we have to switch to Strawberry.
      - name: Use strawberry perl
        if: runner.os == 'Windows'
        shell: bash
        run: echo OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl >> $GITHUB_ENV
        timeout-minutes: 1

      - name: Download WinFsp
        if: runner.os == 'Windows'
        shell: bash -eux {0}
        run: >-
          curl -L --fail
          https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-${{ env.WINFSP_VERSION }}.msi -o '${{ runner.temp }}/winfsp.msi'
        timeout-minutes: 2

      - name: Install WinFsp
        if: runner.os == 'Windows'
        run: |
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', '${{ runner.temp }}\winfsp.msi',
            '/qn', '/norestart',
            'INSTALLLEVEL=1000'
          )

          # Ensure install is successful
          if (@(0, 3010, 1641) -notcontains $p.ExitCode) {
            throw "WinFsp install failed with exit code $($p.ExitCode)"
          }

          # Sanity check
          Get-ChildItem "${env:ProgramFiles(x86)}\WinFsp\bin" | Select-Object -First 20
        timeout-minutes: 1

      - name: Build CLI
        shell: bash -o pipefail -eux {0}
        run: >-
          cross build -p parsec-cli
          --target=${{ matrix.arch }}-${{ matrix.vendor }}-${{ matrix.os }}
          $(python make.py cli-release-cargo-flags --quiet)
        env:
          LIBPARSEC_FORCE_VENDORED_LIBS: ${{ matrix.os == 'linux-musl' && 'true' || 'false' }}
        timeout-minutes: 15

      - name: Linux > Debug target folder
        if: runner.os == 'Linux' && runner.debug
        shell: bash
        run: tree target
        continue-on-error: true
        timeout-minutes: 1

      - name: Windows > Debug target folder
        if: runner.os == 'Windows' && runner.debug
        shell: pwsh
        run: Get-ChildItem -Recurse target
        continue-on-error: true
        timeout-minutes: 1

      - name: Sign files with Artifact Signing
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          # Configure authentication to Azure Trusted Signing
          # CF: https://github.com/Azure/artifact-signing-action/blob/main/docs/AUTHN.md
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

          # Configure the profile that sign the artifact
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE_NAME }}

          # Configure the signature
          # The action only accept absolute paths so we add `${{ github.workspace }}`
          files: ${{ github.workspace }}\target\${{ matrix.arch }}-${{ matrix.vendor }}-${{ matrix.os }}\release\parsec-cli.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Parsec CLI ${{ steps.version.outputs.full }}

      - name: Rename CLI artifact
        id: rename
        shell: bash -eux -o pipefail {0}
        run: |
          FINAL_ARTIFACT_NAME="parsec-cli-${{ steps.version.outputs.full }}-${{ matrix.arch }}-${{ matrix.vendor }}-${{ matrix.os }}${{ matrix.extension }}"
          cp -v target/${{ matrix.arch }}-${{ matrix.vendor }}-${{ matrix.os }}/release/parsec-cli "${{ runner.temp }}/$FINAL_ARTIFACT_NAME"
          echo "artifact_name=$FINAL_ARTIFACT_NAME" >> $GITHUB_OUTPUT
          yq-go --null-input ".${{ matrix.os }}.${{ matrix.arch }}.cli = \"$FINAL_ARTIFACT_NAME\"" | tee "${{ runner.temp }}/artifacts.yml"
        timeout-minutes: 1

      - name: Generate fake package.json for sign script
        if: runner.os == 'Windows'
        run: |
          $jsonContent = '{ "version": "${{ steps.version.outputs.full }}" }'
          $jsonContent | Tee-Object -FilePath "${{ runner.temp }}\package.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin v7.0.1
        with:
          name: cli-${{ matrix.arch }}-${{ matrix.vendor }}-${{ matrix.os }}
          # NOTE: package.json is only present on Windows builds
          path: |
            ${{ runner.temp }}/${{ steps.rename.outputs.artifact_name }}
            ${{ runner.temp }}/artifacts.yml
            ${{ runner.temp }}/package.json
          if-no-files-found: error
        timeout-minutes: 5
